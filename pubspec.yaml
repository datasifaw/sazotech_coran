name: sazotech_coran
description: "Application Android educative SAZOTECH Coran - 4 sourates, audio hors-ligne, favoris et traduction francaise"
publish_to: 'none'
version: 1.9.0+9

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_sazotech.png
    - assets/audio/
    - assets/traductions/
