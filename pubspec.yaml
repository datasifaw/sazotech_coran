name: sazotech_coran
description: "Application Android educative SAZOTECH Coran - 114 sourates, suivi memorisation, audio local et favoris"
publish_to: 'none'
version: 2.0.0+10

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_sazotech.png
    - assets/audio/
    - assets/traductions/
    - assets/quran/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo_icon_android.png
  adaptive_icon_background: '#061528'
  adaptive_icon_foreground: assets/images/logo_icon_android.png

flutter_native_splash:
  color: '#061528'
  image: assets/images/logo_sazotech.png
  android: true
  ios: false
  web: false
  android_12:
    color: '#061528'
    image: assets/images/logo_sazotech.png
